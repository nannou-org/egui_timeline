[package]
name = "egui_timeline"
description = "A general timeline widget for egui, for working with time-based media and control."
version = "0.5.0"
authors = ["mitchmindtree <mail@mitchellnordine.com>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["egui", "timeline", "sequencer", "automation", "daw"]
repository = "https://github.com/nannou-org/egui_timeline"
homepage = "https://github.com/nannou-org/egui_timeline"
edition = "2021"
rust-version = "1.95"

[dependencies]
egui = "0.36"
egui_plot = "0.37"

[dev-dependencies]
eframe = "0.36"
